name: Daily YouTube Briefing

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준입니다.
    # 23:00 UTC = 한국시간(KST) 다음날 오전 8:00
    # 시간을 바꾸려면: 원하는 한국시간에서 9를 뺀 값을 쓰세요. (예: 오전 7시 -> 22:00 UTC)
    - cron: '0 23 * * *'

  # Actions 탭에서 버튼으로 직접 실행할 수 있게 해줍니다. (테스트용)
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 봇 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
